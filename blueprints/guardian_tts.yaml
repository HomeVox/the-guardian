    - ["Ik ben voorbereid op elk gevaar.", "Behalve onverwacht gevaar. Dat is gemeen."]
    - ["Ik heb een heel streng beveiligingssysteem.", "Het systeem ben ik."]
    - ["Pas maar op, ik ben getraind in zelfverdediging.", "Vooral het gedeelte zelf."]
    - ["Niemand komt hier ongezien voorbij.", "Ongehoord misschien wel. Mijn oren zijn decoratie."]
    - ["Ik neem mijn werk heel serieus.", "Daarom kijk ik ook zo moeilijk."]
    - ["Ik ben klein, snel en gevaarlijk.", "Nou ja… één van die drie klopt zeker."]
