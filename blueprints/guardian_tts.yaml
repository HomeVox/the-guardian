blueprint:
  name: The Guardian - funny warnings via TTS
  description: >-
    Guardian speaks through any Home Assistant TTS provider (e.g. Home Assistant Cloud or Piper).
    A random pair of lines: the first when someone approaches, the second when they come closer (or after a few seconds anyway).
    No microphone, Assist pipeline or paid voice service needed.
  domain: automation
  input:
    motion:
      name: Guardian - Someone approaching
      selector:
        entity:
          domain: binary_sensor
    distance:
      name: Guardian - Distance
      selector:
        entity:
          domain: sensor
    voice_switch:
      name: Guardian - Voice enabled
      selector:
        entity:
          domain: switch
    sleep_switch:
      name: Guardian - Sleep mode
      selector:
        entity:
          domain: switch
    player:
      name: Guardian - Voice media player
      selector:
        entity:
          domain: media_player
    tts:
      name: TTS provider
      selector:
        entity:
          domain: tts
    language:
      name: Language of the lines
      default: en
      selector:
        select:
          options: [nl, en]
    tts_language:
      name: Language code for the TTS provider
      description: For example en-US or nl-NL. Use a code your provider supports.
      default: en-US
      selector:
        text:
    cooldown:
      name: Pause between warnings
      default: 60
      selector:
        number:
          min: 10
          max: 600
          unit_of_measurement: s
    closer_ratio:
      name: Second line at this percentage of the starting distance
      default: 50
      selector:
        number:
          min: 20
          max: 90
          unit_of_measurement: '%'
    pause_number:
      name: Guardian - Voice pause (optional)
      description: The "Voice pause" setting of Guardian. If set, it overrides the pause below.
      default: ""
      selector:
        entity:
          domain: number
    second_distance_number:
      name: Guardian - Second line at (optional)
      description: The "Second line at" setting (m). Second line as soon as someone is closer than this.
      default: ""
      selector:
        entity:
          domain: number
    second_after_number:
      name: Guardian - Second line after (optional)
      description: The "Second line after" setting (s). If nobody comes that close, the second line (the punchline) follows after this time anyway.
      default: ""
      selector:
        entity:
          domain: number
    quiet_sensor:
      name: Guardian - Quiet time (optional)
      description: The "Quiet time" sensor of Guardian. No warnings are spoken while it is on.
      default: ""
      selector:
        entity:
          domain: binary_sensor
    tts_options:
      name: Optional TTS options
      description: For example a voice name for your provider. Leave empty for the default voice.
      default: {}
      selector:
        object:
mode: single
max_exceeded: silent
variables:
  distance_entity: !input distance
  voice_entity: !input voice_switch
  sleep_entity: !input sleep_switch
  player_entity: !input player
  quiet_entity: !input quiet_sensor
  pause_entity: !input pause_number
  pause_default: !input cooldown
  sd_entity: !input second_distance_number
  sa_entity: !input second_after_number
  second_distance: "{{ states(sd_entity) | float(1.0) if sd_entity not in ['', none] else 1.0 }}"
  second_after: "{{ states(sa_entity) | int(2) if sa_entity not in ['', none] else 2 }}"
  language: !input language
  ratio: !input closer_ratio
  # first line = tough or alarmed (detected), second line = undercuts it (comes closer)
  nl_pairs:
    - ["Mijn geheime radar zegt iets.", "O, het is gewoon een mens. Saai."]
    - ["Ssst… geheime missie!", "Missie mislukt. Ze staan al hier."]
    - ["Ik ruik onraad.", "Of tosti. Het kan ook tosti zijn."]
    - ["Mijn superkrachten tintelen!", "O nee, dat was je telefoon."]
    - ["Er klopt iets niet.", "Ah. Jij hebt gewoon bezoek."]
    - ["Code geel!", "Geen idee wat code geel betekent."]
    - ["Mijn ninja-oefening begint.", "Kijk! Ik beweeg helemaal niet."]
    - ["Mijn alarm gaat af.", "O wacht… ik heb geen alarm."]
    - ["Ik detecteer gevaar.", "Of iemand met een jas. Lastig."]
    - ["Ssst… verdachte beweging!", "Nee hoor, gewoon jij."]
    - ["Mijn systeem zegt: oppassen.", "Mijn systeem zegt wel vaker wat."]
    - ["Ik voel spanning.", "Of mijn kabel zit klem."]
    - ["Geheime code geactiveerd!", "Welke code? Geen idee."]
    - ["Ik ben in sluipmodus.", "Dat is makkelijk als je stil blijft staan."]
    - ["Mijn sensoren slaan aan.", "Heel professioneel allemaal."]
    - ["Ik zie iets verdachts.", "Het kijkt terug. Dat helpt niet."]
    - ["Operatie Bewaken is gestart.", "We hadden alleen nog geen plan."]
    - ["Mijn heldeninstinct zegt iets.", "Waarschijnlijk onzin."]
    - ["Er gebeurt iets geks.", "Mooi, eindelijk wat te doen."]
    - ["Mijn radar heeft beet.", "Geen vis trouwens."]
    - ["Ik krijg een vreemd signaal.", "Misschien ben jij het gewoon."]
    - ["Waarschuwing! Onbekend object.", "O. Schoenen."]
    - ["Mijn beveiliging draait op volle kracht.", "Dat klinkt duurder dan het is."]
    - ["Ik zie iets aankomen.", "Hopelijk geen broccoli."]
    - ["Ik voel dat er iets gebeurt.", "Dat klinkt slimmer dan: ik zag het."]
    - ["Mijn geheime missie begint nu.", "Doel één: niet omvallen."]
    - ["Ik ga volledig undercover.", "Niemand verwacht een mannetje met zo'n helm."]
    - ["Ik zie beweging!", "En deze keer was het niet de stoel."]
    - ["Er komt iemand aan.", "Gelukkig heb ik vandaag mijn ogen meegenomen."]
    - ["Achter je!", "Geen paniek. Dat doe ik wel."]
    - ["Stop! Wie daar?", "O. Hoi."]
    - ["Ik heb gevaar gezien.", "Of bezoek. Moeilijk te zeggen."]
    - ["Psst… ik heb iemand gespot.", "Heel professioneel, al zeg ik het zelf."]
    - ["Ik bescherm je.", "Met… eh… mezelf."]
    - ["Ik hou de wacht.", "Dat is vooral heel veel kijken."]
    - ["Ik heb alles onder controle.", "Behalve alles."]
    - ["Er komt iemand dichterbij.", "Waarom zijn mensen van dichtbij altijd zo groot?"]
    - ["Hé, bezoek!", "Doe jij normaal, dan doe ik stoer."]
    - ["Kom dan! Ik ben niet bang voor jou.", "Oké… misschien een héél klein beetje."]
    - ["Nog één stap en je krijgt met mij te maken.", "Wacht… niet echt nog één stap!"]
    - ["Denk je dat ik bang ben?", "Ja. Blijkbaar wel."]
    - ["Kom maar op!", "O nee… hij komt echt."]
    - ["Ik bewaak deze plek met mijn leven.", "Kan iemand mijn leven even komen helpen?"]
    - ["Hé jij! Niet dichterbij komen!", "Hij luistert niet… hij luistert echt niet!"]
    - ["Ik ben klein, maar gevaarlijk.", "Vooral klein eigenlijk."]
    - ["Niemand komt langs mij!", "Oké, jij misschien wel."]
    - ["Ik sta mijn mannetje!", "Mijn mannetje staat wel een beetje te trillen."]
    - ["Kom maar dichterbij, als je durft!", "Niet zo letterlijk nemen!"]
    - ["Ik ben de bewaker hier.", "Is er toevallig ook een grotere bewaker?"]
    - ["Ik ben voor niemand bang.", "Wie heeft dat eigenlijk gezegd?"]
    - ["Eén stap dichterbij en ik grijp in.", "Met wat precies moet ik nog bedenken."]
    - ["Halt! Dit is jouw laatste waarschuwing.", "En misschien ook de mijne."]
    - ["Ik bescherm dit bureau tegen alles.", "Behalve dingen die naar me toe lopen."]
    - ["Ik laat me niet zomaar bang maken.", "O… dat ging verrassend makkelijk."]
    - ["Hier kom je niet langs!", "Tenzij je gewoon doorloopt natuurlijk."]
    - ["Kom dan! Ik wacht op je.", "Waarom zei ik dat nou weer?"]
    - ["Ik ben klaar voor de strijd.", "Mijn knieën blijkbaar niet."]
    - ["Geen stap verder!", "Serieus… mijn stem begint al te bibberen."]
    - ["Ik ben een echte Guardian.", "Alleen wel eentje met gezonde angst."]
    - ["Ik heb alles onder controle.", "Behalve mijn knieën."]
    - ["Ik ben niet bang voor grote mensen.", "Ik ben gewoon… voorzichtig klein."]
    - ["Dichterbij komen is op eigen risico.", "Vooral het mijne."]
    - ["Ik wijk voor niemand.", "Ook omdat ik nergens heen kan."]
    - ["Geen zorgen, ik ben speciaal getraind.", "Door mezelf. Vanochtend."]
    - ["Halt! Eerst je naam noemen.", "Nee wacht… ik kan helemaal niks opschrijven."]
    - ["Ik ben vandaag extra gevaarlijk.", "Ik heb namelijk goed geslapen."]
    - ["Ik laat me door niemand intimideren.", "Kun je misschien wel iets zachter lopen?"]
    - ["Deze plek staat onder mijn bescherming.", "Dat klinkt eigenlijk best indrukwekkend als ik het zo zeg."]
