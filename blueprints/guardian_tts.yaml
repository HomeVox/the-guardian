    - ["Ik ben geboren voor dit werk.", "Voor zover ik weet ben ik gewoon in een doos gekomen."]
    - ["Kom maar dichterbij. Ik kan dit aan.", "Dat was figuurlijk bedoeld."]
    - ["Ik bescherm deze plek dag en nacht.", "Behalve tijdens mijn dutjes. Dan is het nachtdienst."]
    - ["Ik heb een heel scherp oog voor gevaar.", "Voor koekjes trouwens ook."]
    - ["Mijn aanwezigheid alleen is meestal genoeg.", "En anders ga ik heel overtuigend piepen."]
    - ["Ik sta hier niet voor de sier.", "Al zie ik er natuurlijk wel fantastisch uit."]
    - ["Ik ben de laatste verdedigingslinie.", "Dat klinkt beter dan klein poppetje op tafel."]
    - ["Ik ben klaar om in te grijpen.", "Waarmee precies blijft een verrassing."]
    - ["Je hoeft nergens bang voor te zijn.", "Ik ben namelijk al bang genoeg voor ons allebei."]
    - ["Ik heb hier alles perfect geregeld.", "Niemand heeft me verteld wat geregeld betekent."]
    - ["Halt! Ik ben een getrainde bewaker.", "Nou ja… ik heb wel een helm."]
    - ["Kom maar op. Ik ben er klaar voor.", "Waarom kom je nou echt?"]
    - ["Deze ogen missen helemaal niks.", "Behalve dingen achter mij."]
    - ["Kijk goed naar mijn gevaarlijke helm.", "Niet naar mijn kleine voetjes."]
    - ["Ik ben gebouwd om angst aan te jagen.", "Het schattige was niet mijn idee."]
    - ["Geen stap verder!", "Mijn voeten kunnen namelijk niet achteruit."]
    - ["Ik zie je wel hoor.", "Met zulke ogen zou dat ook wel moeten."]
    - ["Ik ben een machtige krijger.", "Op bureauschaal."]
    - ["Kom gerust dichterbij.", "Nee wacht… gerust was het verkeerde woord."]
    - ["Mijn rode licht betekent gevaar.", "Vooral voor mijn zelfvertrouwen."]
    - ["Ik sta hier om jou te beschermen.", "Gelukkig hoef ik daarvoor niet te lopen."]
    - ["Ik heb mijn strijdhelm al op.", "Nu nog uitvinden waar de strijd is."]
    - ["Zie je hoe rustig ik blijf?", "Dat trillen hoort bij het ontwerp."]
    - ["Ik ben klein, maar onbevreesd.", "Klein klopt in ieder geval."]
    - ["Mijn ogen staan op scherp.", "Mijn knieën iets minder."]
    - ["Ik bewaak dit hele bureau.", "De rest van de kamer vond ik wat ambitieus."]
    - ["Ik ben vandaag extra stoer.", "Mijn lampjes staan namelijk op rood."]
    - ["Niemand komt langs deze Guardian.", "Tenzij ze links of rechts van me lopen."]
    - ["Ik ben klaar om toe te slaan.", "Figuurlijk dan. Ik heb geen armen."]
    - ["Ik bescherm dit bureau tegen… eh… dingen.", "Heel belangrijke dingen waarschijnlijk."]
    - ["Halt! Dit bureau staat onder mijn bescherming.", "Nou ja, bescherming... ik kan heel hard kijken."]
    - ["Ik zie je. Ik zie alles.", "Behalve als je achter de plant staat. Dan zie ik de plant."]
    - ["Nog een stap en je krijgt met mij te maken!", "Ik ben twaalf centimeter. Maar wel heel boos."]
    - ["Indringer gedetecteerd! Alarmfase rood!", "Rood is ook gewoon mijn favoriete kleur."]
    - ["Ik ben de beste wachter van dit huis.", "Ik ben ook de enige wachter van dit huis."]
    - ["Pas op, ik ben getraind in vechtsporten.", "Nou ja, ik heb er een filmpje over gezien."]
    - ["Ik heb ooit een draak verslagen.", "Het was een plastic draak. Maar hij was wel groot."]
    - ["Niemand komt langs mij!", "Behalve iedereen. Ik heb geen armen die echt bewegen."]
    - ["Mijn zwaard is scherp!", "Ik heb geen zwaard. Maar denk het je even in."]
    - ["Ik waarschuw je, ik ben levensgevaarlijk!", "Voor stof. Ik ben levensgevaarlijk voor stof."]
    - ["Staan blijven! Dit is een beveiligd gebied!", "Beveiligd door mij. Dus... redelijk beveiligd."]
    - ["Ik heb je gezien en ik vergeet nooit een gezicht.", "Ik heb wel geen geheugen. Wie ben jij ook alweer?"]
    - ["Ik roep versterking!", "Hallo? Versterking? Ze nemen niet op."]
    - ["Dit bureau is mijn koninkrijk!", "Het is wel een klein koninkrijk. Met kruimels."]
    - ["Mijn ogen zien in het donker!", "Nee hoor. Doe het licht maar aan, dat is fijner."]
    - ["Ik sta hier dag en nacht op wacht!", "Behalve als de stekker eruit ligt. Dan slaap ik."]
    - ["Ik ben onverslaanbaar!", "Tenzij je me omduwt. Doe dat alsjeblieft niet."]
    - ["Ga weg, of ik word boos!", "Oké, ik was al een beetje boos. Maar nu meer."]
    - ["Ik ken karate, judo en kungfu!", "Alleen de namen. Maar die ken ik heel goed."]
    - ["Welkom in mijn zwaarbewaakte vierkante meter.", "Je staat nu in de persoonlijke ruimte van een plastic ridder."]
  en_pairs:
    - ["My secret radar is telling me something.", "Oh, it's just a human. Boring."]
    - ["Shh… secret mission!", "Mission failed. They're already here."]
    - ["I smell trouble.", "Or a toastie. It could also be a toastie."]
    - ["My superpowers are tingling!", "Oh no, that was your phone."]
    - ["Something's not right.", "Ah. You just have a visitor."]
    - ["Code yellow!", "No idea what code yellow means."]
    - ["My ninja training begins.", "Look! I'm not moving at all."]
    - ["My alarm is going off.", "Oh wait… I don't have an alarm."]
    - ["I detect danger.", "Or someone in a coat. Hard to tell."]
    - ["Shh… suspicious movement!", "Nope, just you."]
    - ["My system says: watch out.", "My system says a lot of things."]
    - ["I sense tension.", "Or my cable is stuck."]
    - ["Secret code activated!", "Which code? No idea."]
    - ["I'm in stealth mode.", "That's easy when you just stand still."]
    - ["My sensors are going off.", "Very professional, all of it."]
    - ["I see something suspicious.", "It's looking back. That doesn't help."]
    - ["Operation Guard Duty has begun.", "We just didn't have a plan yet."]
    - ["My hero instinct is telling me something.", "Probably nonsense."]
    - ["Something strange is happening.", "Great, finally something to do."]
    - ["My radar has a catch.", "Not a fish, by the way."]
    - ["I'm getting a strange signal.", "Maybe it's just you."]
    - ["Warning! Unknown object.", "Oh. Shoes."]
    - ["My security is running at full power.", "That sounds more expensive than it is."]
    - ["I see something coming.", "Hopefully not broccoli."]
    - ["I can feel something happening.", "That sounds smarter than: I saw it."]
    - ["My secret mission starts now.", "Goal one: don't fall over."]
    - ["I'm going fully undercover.", "Nobody expects a little guy with a helmet like this."]
    - ["I see movement!", "And this time it wasn't the chair."]
    - ["Someone's coming.", "Good thing I brought my eyes today."]
    - ["Behind you!", "Don't panic. I'll do that for you."]
    - ["Stop! Who goes there?", "Oh. Hi."]
    - ["I've spotted danger.", "Or a visitor. Hard to say."]
    - ["Psst… I've spotted someone.", "Very professional, if I say so myself."]
    - ["I'll protect you.", "With… uh… myself."]
    - ["I'm keeping watch.", "Which is mostly a lot of looking."]
    - ["I have everything under control.", "Except everything."]
    - ["Someone's getting closer.", "Why are people always so big up close?"]
