    - ["Come on then! I'm not afraid of you.", "Okay… maybe a tiny little bit."]
    - ["One more step and you'll have to deal with me.", "Wait… not literally one more step!"]
    - ["You think I'm scared?", "Yes. Apparently I am."]
    - ["Bring it on!", "Oh no… he's actually coming."]
    - ["I guard this place with my life.", "Could someone come and help my life for a moment?"]
    - ["Hey you! Don't come any closer!", "He's not listening… he's really not listening!"]
    - ["I'm small, but dangerous.", "Mostly small, actually."]
    - ["Nobody gets past me!", "Okay, maybe you do."]
    - ["I'm standing my ground!", "My ground is shaking a little, though."]
    - ["Come closer, if you dare!", "Don't take that so literally!"]
    - ["I'm the guard here.", "Is there by any chance a bigger guard?"]
    - ["I'm not afraid of anyone.", "Who actually said that?"]
    - ["One step closer and I'll step in.", "With what exactly, I still have to figure out."]
    - ["Halt! This is your final warning.", "And maybe mine too."]
    - ["I protect this desk against everything.", "Except things that walk towards me."]
    - ["I don't scare that easily.", "Oh… that was surprisingly easy."]
    - ["You shall not pass!", "Unless you just keep walking, of course."]
    - ["Come on then! I'm waiting for you.", "Why did I say that again?"]
    - ["I'm ready for battle.", "My knees apparently aren't."]
    - ["Not one step further!", "Seriously… my voice is starting to wobble."]
    - ["I'm a real Guardian.", "Just one with a healthy sense of fear."]
    - ["I have everything under control.", "Except my knees."]
    - ["I'm not afraid of big people.", "I'm just… carefully small."]
    - ["Coming closer is at your own risk.", "Mostly mine."]
    - ["I don't back down for anyone.", "Also because I can't go anywhere."]
    - ["Don't worry, I'm specially trained.", "By myself. This morning."]
    - ["Halt! State your name first.", "No wait… I can't write anything down."]
    - ["I'm extra dangerous today.", "I slept really well, you see."]
    - ["Nobody intimidates me.", "Could you maybe walk a little more quietly?"]
    - ["This place is under my protection.", "That actually sounds quite impressive when I say it like that."]
    - ["I just did a security check.", "The bin is innocent, for now."]
    - ["Hey! I know your kind.", "You're those people who just walk wherever you like."]
    - ["I'm prepared for every danger.", "Except unexpected danger. That's just mean."]
    - ["I have a very strict security system.", "The system is me."]
    - ["Watch out, I'm trained in self-defence.", "Mostly the self part."]
    - ["Nobody gets past here unseen.", "Unheard, maybe. My ears are just decoration."]
    - ["I take my job very seriously.", "That's why I look so serious."]
    - ["I'm small, fast and dangerous.", "Well… one of those three is definitely true."]
    - ["I could spring into action at any moment.", "I just hope that moment isn't today."]
    - ["I've personally inspected everything here.", "The stapler remains suspicious."]
    - ["I'm the silent protector of this place.", "Except when I talk. Then I'm mostly the loudest."]
    - ["I've analysed the situation.", "My conclusion is: big."]
    - ["I was born for this job.", "As far as I know, I just came in a box."]
    - ["Come closer. I can handle this.", "That was meant figuratively."]
    - ["I protect this place day and night.", "Except during my naps. That's the night shift."]
    - ["I have a very sharp eye for danger.", "And for biscuits, by the way."]
    - ["My presence alone is usually enough.", "And otherwise I'll beep very convincingly."]
    - ["I'm not just standing here for decoration.", "Although I do look fantastic, of course."]
    - ["I'm the last line of defence.", "That sounds better than little figure on a table."]
    - ["I'm ready to step in.", "With what exactly remains a surprise."]
    - ["You don't need to be afraid of anything.", "I'm already scared enough for both of us."]
    - ["I've arranged everything here perfectly.", "Nobody told me what arranged means."]
    - ["Halt! I'm a trained guard.", "Well… I do have a helmet."]
    - ["Bring it on. I'm ready.", "Why are you actually coming?"]
    - ["These eyes miss absolutely nothing.", "Except things behind me."]
    - ["Take a good look at my dangerous helmet.", "Not at my tiny feet."]
    - ["I was built to strike fear.", "The cute part wasn't my idea."]
    - ["Not one step further!", "My feet can't go backwards, you see."]
    - ["I can see you, you know.", "With eyes like these, I'd better."]
    - ["I'm a mighty warrior.", "On desk scale."]
    - ["Feel free to come closer.", "No wait… free was the wrong word."]
    - ["My red light means danger.", "Mostly for my self-confidence."]
    - ["I'm here to protect you.", "Luckily I don't have to walk for that."]
    - ["I've already got my battle helmet on.", "Now I just need to find out where the battle is."]
    - ["See how calm I stay?", "The trembling is part of the design."]
    - ["I'm small, but fearless.", "Small is correct, anyway."]
    - ["My eyes are razor sharp.", "My knees, slightly less so."]
    - ["I guard this entire desk.", "The rest of the room seemed a bit ambitious."]
    - ["I'm extra tough today.", "My lights are set to red, you see."]
    - ["Nobody gets past this Guardian.", "Unless they walk to the left or right of me."]
    - ["I'm ready to strike.", "Figuratively. I don't have arms."]
    - ["I protect this desk against… uh… things.", "Very important things, probably."]
    - ["Halt! This desk is under my protection.", "Well, protection... I can glare really hard."]
    - ["I see you. I see everything.", "Except when you stand behind the plant. Then I see the plant."]
    - ["One more step and you will have to deal with me!", "I am twelve centimetres tall. But very angry."]
    - ["Intruder detected! Red alert!", "Red is also just my favourite colour."]
    - ["I am the best guard in this house.", "I am also the only guard in this house."]
    - ["Careful, I am trained in martial arts.", "Well, I watched a video about it."]
    - ["I once defeated a dragon.", "It was a plastic dragon. But it was quite big."]
    - ["Nobody gets past me!", "Except everybody. My arms do not really move."]
    - ["My sword is sharp!", "I do not have a sword. Just imagine one."]
    - ["I warn you, I am extremely dangerous!", "To dust. I am extremely dangerous to dust."]
    - ["Stop right there! This is a secured area!", "Secured by me. So... fairly secured."]
    - ["I saw you, and I never forget a face.", "I do not have a memory, though. Who are you again?"]
    - ["I am calling for backup!", "Hello? Backup? They are not answering."]
    - ["This desk is my kingdom!", "It is a small kingdom. With crumbs."]
    - ["My eyes can see in the dark!", "No they cannot. Please turn the light on, that is nicer."]
    - ["I stand guard day and night!", "Unless someone unplugs me. Then I sleep."]
    - ["I am invincible!", "Unless you knock me over. Please do not do that."]
    - ["Go away, or I will get angry!", "Okay, I was already a bit angry. But now more."]
    - ["I know karate, judo and kung fu!", "Just the names. But I know them very well."]
    - ["Welcome to my heavily guarded square metre.", "You are now in the personal space of a plastic knight."]
triggers:
  - trigger: state
    entity_id: !input motion
    from: 'off'
    to: 'on'
conditions:
  - condition: template
    value_template: "{{ quiet_entity in ['', none] or not is_state(quiet_entity, 'on') }}"
  - condition: state
    entity_id: !input voice_switch
    state: 'on'
  - condition: state
    entity_id: !input sleep_switch
    state: 'off'
  - condition: template
    value_template: "{{ states(player_entity) not in ['unavailable','unknown'] }}"
actions:
  - variables:
      pair: "{{ (nl_pairs if language == 'nl' else en_pairs) | random }}"
      start_distance: "{{ states(distance_entity) | float(0) }}"
  - action: tts.speak
    continue_on_error: true
    target:
      entity_id: !input tts
    data:
      media_player_entity_id: !input player
      language: !input tts_language
      message: '{{ pair[0] }}'
      cache: true
      options: !input tts_options
  - wait_template: "{{ is_state(player_entity, 'playing') }}"
    timeout: '00:00:10'
    continue_on_timeout: true
  - wait_template: "{{ not is_state(player_entity, 'playing') }}"
    timeout: '00:00:30'
    continue_on_timeout: true
  - wait_template: >-
      {% set d = states(distance_entity) | float(999) %}
      {{ 0.05 < d < second_distance | float or
         (start_distance | float(0) > 0 and d < start_distance | float * ratio | float / 100) }}
    timeout:
      seconds: "{{ second_after | int }}"
    continue_on_timeout: true
  - if:
      - condition: template
        value_template: "{{ is_state(voice_entity,'on') and is_state(sleep_entity,'off') }}"
    then:
      - action: tts.speak
        continue_on_error: true
        target:
          entity_id: !input tts
        data:
          media_player_entity_id: !input player
          language: !input tts_language
          message: '{{ pair[1] }}'
          cache: true
          options: !input tts_options
  - delay:
      seconds: "{{ states(pause_entity) | int(pause_default) if pause_entity not in ['', none] else pause_default }}"
